name: Casetta cassa checks
on:
  push:
    branches: [feature/casetta-cassa-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Cash register regression tests
        run: npm run test -- src/test/casetta-cassa.test.ts
      - name: Production build
        run: npm run build
