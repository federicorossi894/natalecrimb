name: Casetta cassa checks
on:
  push:
    branches: [feature/casetta-cassa-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Cash register regression tests
        run: bun run test -- src/test/casetta-cassa.test.ts
      - name: Production build
        run: bun run build
